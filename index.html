<!-- neocamera v1.3.1 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>neocamera</title>
<style>
:root{
  --ios-yellow:#ffd60a;
  --ios-red:#ff3b30;
  --chrome:#000;
  --glass:rgba(255,255,255,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;overflow:hidden;overscroll-behavior:none}
body{
  font:500 14px/1.2 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:#fff;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-appearance:none;appearance:none;outline:none}
button:focus-visible{outline:2px solid var(--ios-yellow);outline-offset:3px;border-radius:6px}

#app{
  position:relative;height:100%;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* ---------- top chrome ---------- */
#topBar{
  flex:0 0 auto;height:46px;display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;padding:0 18px;
}
#recPill{
  grid-column:2;display:none;align-items:center;gap:7px;
  background:rgba(0,0,0,.55);border-radius:16px;padding:5px 12px;
  font-size:15px;font-variant-numeric:tabular-nums;
}
#recDot{width:9px;height:9px;border-radius:50%;background:var(--ios-red)}
body[data-rec="1"] #recPill{display:flex}
body[data-rec="1"] #recDot{animation:blink 1s steps(1,end) infinite}
@keyframes blink{50%{opacity:.15}}

#ratioBtn{
  grid-column:3;justify-self:end;background:rgba(255,255,255,.14);
  color:var(--ios-yellow);font-size:13px;font-weight:600;letter-spacing:.02em;
  padding:6px 12px;border-radius:14px;
}
#ratioBtn[disabled]{opacity:.35;color:#fff}
body[data-mode="video"] #ratioBtn,body[data-rec="1"] #ratioBtn,body[data-source="audio"] #ratioBtn{visibility:hidden}

/* ---------- guide opacity bar ---------- */
#guideBar{
  flex:0 0 auto;display:none;align-items:center;gap:12px;
  padding:2px 22px 10px;background:var(--chrome);
}
body[data-overlay="1"] #guideBar{display:flex}
#guideBar .lbl{font-size:13px;color:#8e8e93}
#pct{width:46px;text-align:right;font-size:13px;font-variant-numeric:tabular-nums}
#opacity{
  -webkit-appearance:none;appearance:none;flex:1 1 auto;height:4px;border-radius:2px;
  background:rgba(255,255,255,.28);margin:0;
}
#opacity::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.6);
}
#opacity::-moz-range-thumb{
  width:22px;height:22px;border:0;border-radius:50%;background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.6);
}
#opacity:focus-visible{outline:2px solid var(--ios-yellow);outline-offset:6px}

/* ---------- viewfinder ---------- */
#stage{flex:1 1 auto;position:relative;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
#frame{flex:0 0 auto;max-width:100%;max-height:100%;position:relative;overflow:hidden;background:#000;touch-action:none;contain:paint}
body[data-source="audio"] #frame{display:none}
#preview{width:100%;height:100%;object-fit:cover;display:block;background:#000}
#preview.mirror{transform:scaleX(-1)}

#overlayLayer{
  position:absolute;inset:0;display:none;pointer-events:none;
  will-change:opacity;transform:translateZ(0);
}
body[data-overlay="1"] #overlayLayer{display:block}
#overlayImg{width:100%;height:100%;object-fit:contain;display:block}
body[data-fill="1"] #overlayImg{object-fit:cover}

/* focus and exposure */
#focusBox{
  position:absolute;left:0;top:0;width:76px;height:76px;margin:-38px 0 0 -38px;
  border:1px solid var(--ios-yellow);border-radius:4px;
  opacity:0;pointer-events:none;
  box-shadow:0 0 3px rgba(0,0,0,.45);
  transition:opacity .35s ease;
}
#focusBox.pop{animation:pop .3s ease-out both}
@keyframes pop{0%{opacity:0;transform:scale(1.45)}25%{opacity:1}100%{opacity:1;transform:scale(1)}}
#expo{position:absolute;left:100%;top:50%;margin-left:7px;transform:translateY(-50%);display:none}
#focusBox.expo #expo{display:block}
#expoSun{width:20px;height:20px;fill:var(--ios-yellow);display:block;transition:transform .05s linear}
#lockBadge{
  position:absolute;left:50%;top:14px;transform:translateX(-50%);
  background:var(--ios-yellow);color:#000;font-size:11px;font-weight:700;letter-spacing:.06em;
  padding:3px 8px;border-radius:3px;display:none;
}
body[data-lock="1"] #lockBadge{display:block}

#audioView{display:none;flex-direction:column;align-items:center;gap:26px;color:#8e8e93}
body[data-source="audio"] #audioView{display:flex}
#audioView svg{width:54px;height:54px;fill:#8e8e93}
#bars{display:flex;align-items:flex-end;gap:6px;height:64px}
#bars i{width:6px;height:6px;border-radius:3px;background:var(--ios-red);transition:height .08s linear}
#audioView p{margin:0;font-size:13px;letter-spacing:.02em}

#shutterFx{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
#shutterFx.go{animation:shut .24s ease-out}
@keyframes shut{0%{opacity:1}100%{opacity:0}}

#toast{
  position:absolute;left:50%;bottom:18px;transform:translate(-50%,8px);
  background:rgba(0,0,0,.62);border-radius:16px;padding:7px 14px;
  font-size:13px;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis;
  opacity:0;transition:opacity .2s ease,transform .2s ease;pointer-events:none;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- bottom chrome ---------- */
#bottomBar{flex:0 0 auto;background:var(--chrome);padding-bottom:6px}
#ratioBar{display:none;flex-wrap:wrap;justify-content:center;gap:6px;padding:8px 10px 2px}
#ratioBar.show{display:flex}
#orientBtn{
  font-size:12px;font-weight:600;color:var(--ios-yellow);
  padding:6px 13px;border-radius:13px;background:rgba(255,255,255,.12);
}
#ratioBar .sep{width:1px;height:20px;background:rgba(255,255,255,.2);align-self:center}
.ratio{
  font-size:12px;font-weight:600;letter-spacing:.03em;color:#fff;
  padding:6px 13px;border-radius:13px;background:rgba(255,255,255,.12);
}
.ratio.active{background:var(--ios-yellow);color:#000}

#modes{display:flex;align-items:center;justify-content:center;gap:30px;height:38px}
.mode{
  font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:rgba(255,255,255,.82);padding:8px 2px;transition:color .15s ease;
}
.mode.active{color:var(--ios-yellow)}
.mode[disabled]{color:rgba(255,255,255,.28)}

#controls{height:112px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 24px}
#guideBtn{
  width:52px;height:52px;border-radius:7px;justify-self:start;
  background:#1c1c1e;display:grid;place-items:center;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);
}
#guideBtn[disabled]{opacity:.45}
#guideBtn svg{width:26px;height:26px;stroke:#aeaeb2;stroke-width:2;stroke-linecap:round;fill:none}
#guideBtn .ic-close,#guideBtn .spin{display:none}
body[data-overlay="1"] #guideBtn .ic-add{display:none}
body[data-overlay="1"] #guideBtn .ic-close{display:block}
#guideBtn.busy .ic-add,#guideBtn.busy .ic-close{display:none}
#guideBtn.busy .spin{
  display:block;width:22px;height:22px;border-radius:50%;
  border:2px solid rgba(255,255,255,.22);border-top-color:#aeaeb2;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

#shutter{
  width:74px;height:74px;border-radius:50%;justify-self:center;
  box-shadow:inset 0 0 0 3px #fff;display:grid;place-items:center;transition:transform .1s ease;
}
#shutter:active{transform:scale(.94)}
#shutter[disabled]{opacity:.4}
#core{width:60px;height:60px;border-radius:50%;background:#fff;transition:width .18s ease,height .18s ease,border-radius .18s ease,background .18s ease}
body[data-mode="video"] #core{background:var(--ios-red)}
body[data-rec="1"] #core{width:30px;height:30px;border-radius:8px;background:var(--ios-red)}

#flip{width:46px;height:46px;border-radius:50%;justify-self:end;background:var(--glass);display:grid;place-items:center}
#flip svg{width:24px;height:24px;fill:#fff}
#flip[disabled]{opacity:.35}

/* ---------- permission gate ---------- */
#gate{
  position:absolute;inset:0;z-index:10;background:#000;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;padding:34px;text-align:center;
}
#gate.show{display:flex}
#gate h1{margin:0;font-size:20px;font-weight:600}
#gate p{margin:0;max-width:34ch;font-size:14px;font-weight:400;line-height:1.45;color:#aeaeb2}
#gateBtn{margin-top:6px;background:var(--ios-yellow);color:#000;font-weight:600;font-size:16px;padding:12px 26px;border-radius:24px}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body data-mode="photo" data-rec="0" data-source="none" data-overlay="0" data-fill="0" data-lock="0">
<div id="app">

  <div id="topBar">
    <div id="recPill"><span id="recDot"></span><span id="timer">00:00</span></div>
    <button id="ratioBtn" type="button" aria-label="Aspect ratio">4:3</button>
  </div>

  <div id="guideBar">
    <span class="lbl">Guide</span>
    <input id="opacity" type="range" min="0" max="100" step="1" value="50" aria-label="Guide opacity">
    <span id="pct">50%</span>
  </div>

  <div id="stage">
    <div id="frame">
      <video id="preview" playsinline autoplay muted></video>
      <div id="overlayLayer"><img id="overlayImg" alt="" decoding="async"></div>
      <div id="focusBox">
        <div id="expo">
          <svg id="expoSun" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0-6l1.6 3.2h-3.2L12 2zm0 20l-1.6-3.2h3.2L12 22zM2 12l3.2-1.6v3.2L2 12zm20 0l-3.2 1.6v-3.2L22 12zM5 5l3.4.9-2.5 2.5L5 5zm14 14l-3.4-.9 2.5-2.5L19 19zM19 5l-.9 3.4-2.5-2.5L19 5zM5 19l.9-3.4 2.5 2.5L5 19z"/></svg>
        </div>
      </div>
      <div id="lockBadge">AE/AF LOCK</div>
      <div id="shutterFx"></div>
    </div>

    <div id="audioView">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-4.08A7 7 0 0 0 19 11z"/></svg>
      <div id="bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <p>Audio only. The camera is not available.</p>
    </div>

    <div id="toast"></div>
  </div>

  <div id="bottomBar">
    <div id="ratioBar">
      <button id="orientBtn" type="button" aria-label="Orientation">Vertical</button>
      <span class="sep"></span>
      <button class="ratio" data-r="1" data-h="1:1" data-v="1:1" type="button">1:1</button>
      <button class="ratio active" data-r="1.3333" data-h="4:3" data-v="3:4" type="button">4:3</button>
      <button class="ratio" data-r="1.5" data-h="3:2" data-v="2:3" type="button">3:2</button>
      <button class="ratio" data-r="1.7778" data-h="16:9" data-v="9:16" type="button">16:9</button>
      <button class="ratio" data-r="0" data-h="Full" data-v="Full" type="button">Full</button>
    </div>
    <div id="modes">
      <button class="mode active" id="modePhoto" data-mode="photo" type="button">Photo</button>
      <button class="mode" id="modeVideo" data-mode="video" type="button">Video</button>
    </div>
    <div id="controls">
      <button id="guideBtn" type="button" title="Add a guide photo" aria-label="Add a guide photo">
        <svg class="ic-add" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <svg class="ic-close" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        <span class="spin"></span>
      </button>
      <input id="guideFile" type="file" accept="image/*" hidden>
      <button id="shutter" type="button" aria-label="Take a photo"><span id="core"></span></button>
      <button id="flip" type="button" aria-label="Change the camera">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2.5L8.2 6.3 12 10V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
      </button>
    </div>
  </div>

  <div id="gate" class="show">
    <h1 id="gateTitle">neocamera</h1>
    <p id="gateText">This app needs the camera or the microphone. Touch the button and give permission.</p>
    <button id="gateBtn" type="button">Start the camera</button>
  </div>

</div>

<script>
(function(){
'use strict';

var VERSION = '1.3.1';
var GUIDE_MAX = 1600;   /* largest side of the prepared guide photo, in pixels */

var el = {
  body: document.body,
  stage: document.getElementById('stage'),
  frame: document.getElementById('frame'),
  preview: document.getElementById('preview'),
  fx: document.getElementById('shutterFx'),
  toast: document.getElementById('toast'),
  timer: document.getElementById('timer'),
  shutter: document.getElementById('shutter'),
  guideBtn: document.getElementById('guideBtn'),
  guideFile: document.getElementById('guideFile'),
  layer: document.getElementById('overlayLayer'),
  oimg: document.getElementById('overlayImg'),
  slider: document.getElementById('opacity'),
  pct: document.getElementById('pct'),
  ratioBtn: document.getElementById('ratioBtn'),
  ratioBar: document.getElementById('ratioBar'),
  orientBtn: document.getElementById('orientBtn'),
  ratios: Array.prototype.slice.call(document.querySelectorAll('.ratio')),
  focusBox: document.getElementById('focusBox'),
  expoSun: document.getElementById('expoSun'),
  flip: document.getElementById('flip'),
  modePhoto: document.getElementById('modePhoto'),
  modeVideo: document.getElementById('modeVideo'),
  bars: Array.prototype.slice.call(document.querySelectorAll('#bars i')),
  gate: document.getElementById('gate'),
  gateTitle: document.getElementById('gateTitle'),
  gateText: document.getElementById('gateText'),
  gateBtn: document.getElementById('gateBtn')
};

var S = {
  mode: 'photo',
  facing: 'environment',
  ratio: 1.3333,
  orient: 'auto',   /* auto, v, or h */
  stream: null,
  hasVideo: false,
  hasAudio: false,
  rec: null,
  chunks: [],
  recStart: 0,
  tick: 0,
  guideUrl: '',
  busy: false,
  wake: null,
  audioCtx: null,
  analyser: null,
  meterId: 0,
  multiCam: true,
  expoCap: null,
  expoVal: 0,
  locked: false,
  focusActive: false,
  focusTimers: []
};

/* ---------------- helpers ---------------- */

function toast(msg){
  el.toast.textContent = msg;
  el.toast.classList.add('show');
  clearTimeout(toast.id);
  toast.id = setTimeout(function(){ el.toast.classList.remove('show'); }, 2600);
}

function stamp(){
  var d = new Date();
  function p(n){ return (n < 10 ? '0' : '') + n; }
  return d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '_' +
         p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
}

function extFor(mime){
  var m = (mime || '').toLowerCase();
  if (m.indexOf('mp4') >= 0) return m.indexOf('audio') === 0 ? 'm4a' : 'mp4';
  if (m.indexOf('mpeg') >= 0) return 'mp3';
  if (m.indexOf('aac') >= 0) return 'aac';
  if (m.indexOf('quicktime') >= 0) return 'mov';
  if (m.indexOf('ogg') >= 0) return 'ogg';
  if (m.indexOf('webm') >= 0) return 'webm';
  return 'bin';
}

function save(blob, name){
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
}

function videoTrack(){
  return S.stream ? (S.stream.getVideoTracks()[0] || null) : null;
}

/* ---------------- frame geometry ---------------- */

/* The frame is the visible picture area. The preview fills it and the app cuts
   the sides. A capture uses the same cut, thus the file agrees with the screen. */
function isPortrait(){
  if (S.orient === 'v') return true;
  if (S.orient === 'h') return false;
  var r = el.stage.getBoundingClientRect();
  return r.height >= r.width;
}

/* Full uses the true shape of the camera image. The other options use the
   selected shape, turned to the selected orientation. */
function frameAspect(){
  var vw = el.preview.videoWidth, vh = el.preview.videoHeight;
  if (S.mode === 'video' || !S.ratio){
    if (vw && vh) return vw / vh;
    return isPortrait() ? 3 / 4 : 4 / 3;
  }
  return isPortrait() ? 1 / S.ratio : S.ratio;
}

function layoutFrame(){
  var r = el.stage.getBoundingClientRect();
  if (!r.width || !r.height) return;
  var a = frameAspect();
  var w = r.width, h = w / a;
  if (h > r.height){ h = r.height; w = h * a; }
  el.frame.style.width = Math.round(w) + 'px';
  el.frame.style.height = Math.round(h) + 'px';
}

function setRatio(v){
  S.ratio = v;
  updateRatioLabels();
  layoutFrame();
}

function setOrient(){
  S.orient = isPortrait() ? 'h' : 'v';
  updateRatioLabels();
  layoutFrame();
}

function updateRatioLabels(){
  var p = isPortrait();
  var active = '';
  el.ratios.forEach(function(b){
    b.textContent = p ? b.dataset.v : b.dataset.h;
    var on = parseFloat(b.dataset.r) === S.ratio;
    b.classList.toggle('active', on);
    if (on) active = b.textContent;
  });
  el.orientBtn.textContent = p ? 'Vertical' : 'Horizontal';
  el.ratioBtn.textContent = active || 'Full';
}

/* ---------------- camera and microphone ---------------- */

function videoWanted(facing){
  return { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } };
}

function stopStream(){
  if (!S.stream) return;
  S.stream.getTracks().forEach(function(t){ t.stop(); });
  S.stream = null;
}

function gum(c){ return navigator.mediaDevices.getUserMedia(c); }

function startStream(facing){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    showGate('Not available', 'This browser does not give access to the camera. Open the page with https or localhost.');
    return Promise.resolve(false);
  }
  stopStream();
  return gum({ video: videoWanted(facing), audio: true })
    .catch(function(){ return gum({ video: videoWanted(facing) }); })
    .catch(function(){ return gum({ audio: true }); })
    .then(function(stream){ return applyStream(stream, facing); })
    .catch(function(err){
      var why = (err && err.name === 'NotAllowedError')
        ? 'Permission was refused. Give permission to the camera or the microphone, then try again.'
        : 'No camera and no microphone were found.';
      showGate('No access', why);
      return false;
    });
}

function applyStream(stream, facing){
  S.stream = stream;
  S.facing = facing;
  S.hasVideo = stream.getVideoTracks().length > 0;
  S.hasAudio = stream.getAudioTracks().length > 0;
  clearFocus();

  if (S.hasVideo){
    el.preview.srcObject = stream;
    el.preview.classList.toggle('mirror', facing === 'user');
    var p = el.preview.play();
    if (p && p.catch) p.catch(function(){});
    readCapabilities();
  }

  el.body.setAttribute('data-source', S.hasVideo ? (S.hasAudio ? 'both' : 'video') : 'audio');
  if (!S.hasVideo) startMeter(stream); else stopMeter();

  hideGate();
  if (!S.hasVideo) setMode('video');
  if (!S.hasAudio && S.hasVideo) toast('The microphone is off. Video has no sound.');
  refreshUI();
  countCameras();
  layoutFrame();
  setTimeout(layoutFrame, 150);
  return true;
}

function readCapabilities(){
  var t = videoTrack();
  S.expoCap = null;
  if (!t || !t.getCapabilities) return;
  var caps;
  try { caps = t.getCapabilities() || {}; } catch (e){ return; }
  if (caps.exposureCompensation) S.expoCap = caps.exposureCompensation;
}

function countCameras(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
  navigator.mediaDevices.enumerateDevices().then(function(list){
    S.multiCam = list.filter(function(d){ return d.kind === 'videoinput'; }).length > 1;
    refreshUI();
  }).catch(function(){});
}

function flipCamera(){
  if (!S.hasVideo || S.rec) return;
  var next = S.facing === 'user' ? 'environment' : 'user';
  el.flip.disabled = true;
  startStream(next).then(function(){ el.flip.disabled = false; refreshUI(); });
}

/* ---------------- focus, exposure, lock ---------------- */

function clearFocusTimers(){
  S.focusTimers.forEach(clearTimeout);
  S.focusTimers = [];
}

function clearFocus(){
  clearFocusTimers();
  S.locked = false;
  S.expoVal = 0;
  S.focusActive = false;
  el.body.setAttribute('data-lock','0');
  el.focusBox.classList.remove('pop','expo');
  el.focusBox.style.opacity = '0';
  el.expoSun.style.transform = 'translateY(0)';
}

function showFocusBox(x, y, lock){
  clearFocusTimers();
  var b = el.focusBox;
  b.style.left = x + 'px';
  b.style.top = y + 'px';
  b.classList.remove('pop');
  void b.offsetWidth;
  b.classList.toggle('expo', !!S.expoCap);
  b.style.opacity = '1';
  b.classList.add('pop');
  S.focusActive = true;
  S.locked = !!lock;
  el.body.setAttribute('data-lock', lock ? '1' : '0');

  /* The animation holds its last frame, thus the class comes off before a fade. */
  S.focusTimers.push(setTimeout(function(){ b.classList.remove('pop'); }, 320));
  S.focusTimers.push(setTimeout(function(){ if (!S.locked) b.style.opacity = '0.6'; }, 1100));
  if (!lock){
    S.focusTimers.push(setTimeout(function(){
      b.style.opacity = '0';
      S.focusActive = false;
    }, 2800));
  }
}

function applyFocus(nx, ny, lock){
  var t = videoTrack();
  if (!t || !t.applyConstraints) return;
  var caps = {};
  try { caps = (t.getCapabilities && t.getCapabilities()) || {}; } catch (e){}
  var adv = {};
  if (caps.pointsOfInterest) adv.pointsOfInterest = [{ x: nx, y: ny }];
  if (caps.focusMode && caps.focusMode.indexOf('single-shot') >= 0) adv.focusMode = 'single-shot';
  if (caps.exposureMode){
    var want = lock ? 'single-shot' : 'continuous';
    if (caps.exposureMode.indexOf(want) >= 0) adv.exposureMode = want;
  }
  var keys = Object.keys(adv);
  if (!keys.length) return;
  t.applyConstraints({ advanced: [adv] }).catch(function(){});
}

function nudgeExposure(dy){
  if (!S.expoCap) return;
  var span = (S.expoCap.max - S.expoCap.min) || 1;
  var step = S.expoCap.step || (span / 32);
  var val = S.expoVal - (dy / 90) * span;
  val = Math.max(S.expoCap.min, Math.min(S.expoCap.max, val));
  val = Math.round(val / step) * step;
  if (val === S.expoVal) return;
  S.expoVal = val;
  var t = videoTrack();
  if (t && t.applyConstraints){
    t.applyConstraints({ advanced: [{ exposureCompensation: val }] }).catch(function(){});
  }
  var mid = (S.expoCap.max + S.expoCap.min) / 2;
  var off = -((val - mid) / (span / 2)) * 32;
  el.expoSun.style.transform = 'translateY(' + off.toFixed(1) + 'px)';
}

/* ---------------- pointer on the viewfinder ---------------- */

(function(){
  var start = null, moved = false, longFired = false, longId = 0, lastY = 0;

  el.frame.addEventListener('pointerdown', function(e){
    if (!S.hasVideo) return;
    start = { x: e.clientX, y: e.clientY, t: Date.now() };
    moved = false; longFired = false; lastY = e.clientY;
    el.frame.setPointerCapture && el.frame.setPointerCapture(e.pointerId);
    longId = setTimeout(function(){
      if (moved || !start) return;
      longFired = true;
      focusHere(start.x, start.y, true);
      if (navigator.vibrate) navigator.vibrate(12);
      toast('Focus and exposure are locked.');
    }, 520);
  });

  el.frame.addEventListener('pointermove', function(e){
    if (!start) return;
    var dx = e.clientX - start.x, dy = e.clientY - start.y;
    if (!moved && Math.abs(dx) + Math.abs(dy) > 10){ moved = true; clearTimeout(longId); }
    if (moved && S.focusActive && Math.abs(dy) > Math.abs(dx)){
      nudgeExposure(e.clientY - lastY);
    }
    lastY = e.clientY;
  });

  el.frame.addEventListener('pointerup', function(e){
    if (!start) return;
    clearTimeout(longId);
    var dx = e.clientX - start.x, dy = e.clientY - start.y;
    var s = start; start = null;

    if (longFired) return;   /* the long press set the lock, a drag set the exposure */
    if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy)){
      setMode(dx < 0 ? 'video' : 'photo');
      return;
    }
    if (moved) return;
    if (S.guideUrl){ toggleFill(); return; }
    focusHere(s.x, s.y, false);
  });

  el.frame.addEventListener('pointercancel', function(){ clearTimeout(longId); start = null; });

  function focusHere(cx, cy, lock){
    var r = el.frame.getBoundingClientRect();
    var x = Math.max(0, Math.min(r.width, cx - r.left));
    var y = Math.max(0, Math.min(r.height, cy - r.top));
    S.expoVal = 0;
    el.expoSun.style.transform = 'translateY(0)';
    showFocusBox(x, y, lock);
    applyFocus(x / r.width, y / r.height, lock);
  }
})();

/* ---------------- guide overlay ---------------- */

/* The guide is an interface element above the preview. The app captures from the
   video element and records the camera stream, thus the guide never enters a file. */

function openGuide(file){
  if (!file) return;
  if (file.type.indexOf('image/') !== 0){ toast('Select a photo file.'); return; }
  el.guideBtn.classList.add('busy');
  prepare(file).then(function(url){
    clearGuideUrl();
    S.guideUrl = url;
    el.oimg.src = url;
    el.body.setAttribute('data-overlay','1');
    el.body.setAttribute('data-fill','0');
    el.guideBtn.classList.remove('busy');
    el.guideBtn.title = 'Remove the guide photo';
    el.guideBtn.setAttribute('aria-label','Remove the guide photo');
    setOpacity(el.slider.value);
    toast('Guide on. Touch the picture for fit or fill.');
  }).catch(function(){
    el.guideBtn.classList.remove('busy');
    el.guideFile.value = '';
    toast('The photo did not open. Try a JPG or a PNG.');
  });
}

/* A photo from a phone is 12 megapixels or more. A bitmap of that size makes the
   browser repaint a very large layer above live video, which is slow. The app
   makes a small copy one time, thus the overlay stays smooth. */
function prepare(file){
  if (file.size < 900000) return Promise.resolve(URL.createObjectURL(file));
  return decode(file).then(function(src){
    var w = src.width, h = src.height;
    var k = Math.min(1, GUIDE_MAX / Math.max(w, h));
    if (k === 1 && file.size < 2500000) return URL.createObjectURL(file);
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * k));
    c.height = Math.max(1, Math.round(h * k));
    var ctx = c.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(src, 0, 0, c.width, c.height);
    if (src.close) src.close();
    var alpha = /png|webp|gif|svg/.test(file.type);
    return new Promise(function(res, rej){
      c.toBlob(function(b){
        b ? res(URL.createObjectURL(b)) : rej(new Error('encode'));
      }, alpha ? 'image/png' : 'image/jpeg', 0.86);
    });
  });
}

/* createImageBitmap decodes off the main thread. The img fallback does not. */
function decode(file){
  if (window.createImageBitmap){
    return createImageBitmap(file).catch(function(){ return viaImg(file); });
  }
  return viaImg(file);
}

function viaImg(file){
  return new Promise(function(res, rej){
    var u = URL.createObjectURL(file);
    var i = new Image();
    i.onload = function(){ URL.revokeObjectURL(u); res(i); };
    i.onerror = function(){ URL.revokeObjectURL(u); rej(new Error('decode')); };
    i.src = u;
  });
}

function closeGuide(){
  clearGuideUrl();
  el.oimg.removeAttribute('src');
  el.body.setAttribute('data-overlay','0');
  el.body.setAttribute('data-fill','0');
  el.guideBtn.title = 'Add a guide photo';
  el.guideBtn.setAttribute('aria-label','Add a guide photo');
  el.guideFile.value = '';
}

function clearGuideUrl(){
  if (S.guideUrl) URL.revokeObjectURL(S.guideUrl);
  S.guideUrl = '';
}

function toggleFill(){
  var on = el.body.getAttribute('data-fill') === '1';
  el.body.setAttribute('data-fill', on ? '0' : '1');
  toast(on ? 'Guide: fit' : 'Guide: fill');
}

function setOpacity(v){
  el.layer.style.opacity = (v / 100).toString();
  el.pct.textContent = Math.round(v) + '%';
}

/* ---------------- audio level meter ---------------- */

function startMeter(stream){
  stopMeter();
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    S.audioCtx = new AC();
    var src = S.audioCtx.createMediaStreamSource(stream);
    S.analyser = S.audioCtx.createAnalyser();
    S.analyser.fftSize = 512;
    src.connect(S.analyser);
  } catch (e){ return; }

  var buf = new Uint8Array(S.analyser.frequencyBinCount);
  var step = Math.floor(buf.length / el.bars.length);
  function draw(){
    S.analyser.getByteFrequencyData(buf);
    for (var i = 0; i < el.bars.length; i++){
      var sum = 0;
      for (var j = 0; j < step; j++) sum += buf[i * step + j];
      el.bars[i].style.height = Math.max(6, Math.round((sum / step / 255) * 62)) + 'px';
    }
    S.meterId = requestAnimationFrame(draw);
  }
  draw();
}

function stopMeter(){
  if (S.meterId) cancelAnimationFrame(S.meterId);
  S.meterId = 0;
  if (S.audioCtx && S.audioCtx.close){ try { S.audioCtx.close(); } catch (e){} }
  S.audioCtx = null;
  S.analyser = null;
}

/* ---------------- photo ---------------- */

function takePhoto(){
  if (!S.hasVideo || S.busy) return;
  var vw = el.preview.videoWidth, vh = el.preview.videoHeight;
  if (!vw || !vh){ toast('The camera is not ready.'); return; }

  S.busy = true;
  el.fx.classList.remove('go');
  void el.fx.offsetWidth;
  el.fx.classList.add('go');

  var r = el.frame.getBoundingClientRect();
  var a = (r.width && r.height) ? r.width / r.height : vw / vh;
  var sw = vw, sh = vw / a;
  if (sh > vh){ sh = vh; sw = vh * a; }
  var sx = (vw - sw) / 2, sy = (vh - sh) / 2;

  var c = document.createElement('canvas');
  c.width = Math.round(sw); c.height = Math.round(sh);
  c.getContext('2d').drawImage(el.preview, sx, sy, sw, sh, 0, 0, c.width, c.height);

  var name = 'IMG_' + stamp() + '.jpg';
  c.toBlob(function(blob){
    if (!blob){ S.busy = false; toast('The photo failed.'); return; }
    save(blob, name);
    toast('Saved ' + name);
    S.busy = false;
  }, 'image/jpeg', 0.92);
}

/* ---------------- video and audio recording ---------------- */

function pickMime(withVideo){
  var list = withVideo
    ? ['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=h264,aac','video/mp4',
       'video/webm;codecs=h264,opus','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm']
    : ['audio/mpeg','audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/aac','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'];
  if (!window.MediaRecorder) return '';
  for (var i = 0; i < list.length; i++){
    if (MediaRecorder.isTypeSupported(list[i])) return list[i];
  }
  return '';
}

function startRec(){
  if (!S.stream || S.rec) return;
  if (!window.MediaRecorder){ toast('This browser cannot record.'); return; }

  var mime = pickMime(S.hasVideo);
  var rec;
  try {
    rec = mime ? new MediaRecorder(S.stream, { mimeType: mime }) : new MediaRecorder(S.stream);
  } catch (e){
    try { rec = new MediaRecorder(S.stream); } catch (e2){ toast('The recorder did not start.'); return; }
  }

  S.chunks = [];
  S.rec = rec;
  rec.ondataavailable = function(ev){ if (ev.data && ev.data.size) S.chunks.push(ev.data); };
  rec.onstop = finishRec;
  rec.onerror = function(){ toast('The recording stopped with an error.'); };
  rec.start(1000);

  S.recStart = Date.now();
  el.body.setAttribute('data-rec','1');
  el.timer.textContent = '00:00';
  S.tick = setInterval(updateTimer, 250);
  lockScreen();
  refreshUI();
}

function stopRec(){
  if (!S.rec) return;
  try { S.rec.stop(); } catch (e){}
}

function finishRec(){
  clearInterval(S.tick);
  var type = (S.rec && S.rec.mimeType) || pickMime(S.hasVideo) || (S.hasVideo ? 'video/mp4' : 'audio/mp4');
  var blob = new Blob(S.chunks, { type: type });
  S.chunks = [];
  S.rec = null;
  el.body.setAttribute('data-rec','0');
  unlockScreen();
  refreshUI();

  if (!blob.size){ toast('The recording was empty.'); return; }
  var name = (S.hasVideo ? 'VID_' : 'AUD_') + stamp() + '.' + extFor(type);
  save(blob, name);
  toast('Saved ' + name);
}

function updateTimer(){
  var s = Math.floor((Date.now() - S.recStart) / 1000);
  var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
  function p(n){ return (n < 10 ? '0' : '') + n; }
  el.timer.textContent = (h ? p(h) + ':' : '') + p(m) + ':' + p(r);
}

function lockScreen(){
  if (!navigator.wakeLock || !navigator.wakeLock.request) return;
  navigator.wakeLock.request('screen').then(function(w){ S.wake = w; }).catch(function(){});
}
function unlockScreen(){
  if (S.wake && S.wake.release){ try { S.wake.release(); } catch (e){} }
  S.wake = null;
}

/* ---------------- interface ---------------- */

function setMode(mode){
  if (S.rec || mode === S.mode) return;
  if (mode === 'photo' && !S.hasVideo) return;
  S.mode = mode;
  el.body.setAttribute('data-mode', mode);
  el.modePhoto.classList.toggle('active', mode === 'photo');
  el.modeVideo.classList.toggle('active', mode === 'video');
  if (mode === 'video') el.ratioBar.classList.remove('show');
  layoutFrame();
  refreshUI();
}

function refreshUI(){
  var live = S.hasVideo || S.hasAudio;
  el.modePhoto.disabled = !S.hasVideo;
  el.modeVideo.disabled = !live;
  el.shutter.disabled = !live || (S.mode === 'photo' && !S.hasVideo);
  el.flip.disabled = !S.hasVideo || !!S.rec || !S.multiCam;
  el.guideBtn.disabled = !S.hasVideo;
  el.ratioBtn.disabled = !S.hasVideo;
  el.shutter.setAttribute('aria-label',
    S.mode === 'photo' ? 'Take a photo' : (S.rec ? 'Stop the recording' : 'Start the recording'));
}

function showGate(title, text){
  el.gateTitle.textContent = title;
  el.gateText.textContent = text;
  el.gate.classList.add('show');
}
function hideGate(){ el.gate.classList.remove('show'); }

/* ---------------- events ---------------- */

el.shutter.addEventListener('click', function(){
  if (S.mode === 'photo') takePhoto();
  else if (S.rec) stopRec();
  else startRec();
});

el.modePhoto.addEventListener('click', function(){ setMode('photo'); });
el.modeVideo.addEventListener('click', function(){ setMode('video'); });
el.flip.addEventListener('click', flipCamera);

el.ratioBtn.addEventListener('click', function(){ el.ratioBar.classList.toggle('show'); });
el.ratios.forEach(function(b){
  b.addEventListener('click', function(){ setRatio(parseFloat(b.dataset.r)); });
});
el.orientBtn.addEventListener('click', setOrient);

el.guideBtn.addEventListener('click', function(){
  if (el.guideBtn.classList.contains('busy')) return;
  if (S.guideUrl) closeGuide();
  else el.guideFile.click();
});
el.guideFile.addEventListener('change', function(){ openGuide(this.files && this.files[0]); });
el.slider.addEventListener('input', function(){ setOpacity(this.value); });

el.gateBtn.addEventListener('click', function(){
  el.gateBtn.disabled = true;
  startStream(S.facing).then(function(){ el.gateBtn.disabled = false; });
});

el.preview.addEventListener('loadedmetadata', layoutFrame);
el.preview.addEventListener('resize', layoutFrame);
el.preview.addEventListener('playing', layoutFrame);
window.addEventListener('resize', relayout);
window.addEventListener('orientationchange', function(){ setTimeout(relayout, 260); });

function relayout(){ updateRatioLabels(); layoutFrame(); }

document.addEventListener('keydown', function(e){
  if (e.key === ' ' || e.key === 'Enter'){
    if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
    e.preventDefault();
    el.shutter.click();
  }
});

document.addEventListener('visibilitychange', function(){ if (document.hidden && S.rec) stopRec(); });
window.addEventListener('pagehide', function(){ stopRec(); stopStream(); clearGuideUrl(); });

/* ---------------- start ---------------- */

document.title = 'neocamera ' + VERSION;
setRatio(S.ratio);
startStream(S.facing);

})();
</script>
